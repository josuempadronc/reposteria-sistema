name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y sincronizar Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          node sync-www.js
          if [ ! -d "android" ]; then npx cap add android; else npx cap sync android; fi

      - name: Compilar APK Debug
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DulceReposteria-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

